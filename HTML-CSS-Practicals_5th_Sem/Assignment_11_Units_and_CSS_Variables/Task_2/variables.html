<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Variables</title>
  <style>
    :root {
      --main-color: #1d3557;
      --accent-color: #e63946;
      --page-padding: 20px;
    }
    body { color: var(--main-color); padding: var(--page-padding); }
    h1 { color: var(--accent-color); }
  </style>
</head>
<body>
  <h1>Reusable CSS Variables</h1>
  <p>The main text and heading colours come from custom properties.</p>
</body>
</html>
