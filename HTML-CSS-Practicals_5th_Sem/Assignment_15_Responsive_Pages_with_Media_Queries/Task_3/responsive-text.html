<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Text</title>
  <style>
    body { font-size: 1rem; }
    h1 { font-size: 1.5rem; }
    @media (min-width: 600px) {
      h1 { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <h1>Text That Adapts</h1>
  <p>The heading grows on wider screens while body text stays readable.</p>
</body>
</html>
