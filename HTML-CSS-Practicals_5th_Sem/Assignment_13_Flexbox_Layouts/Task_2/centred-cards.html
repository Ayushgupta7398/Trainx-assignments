<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centred Flex Cards</title>
  <style>
    .row { min-height: 260px; display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; }
    .card { width: 190px; padding: 16px; text-align: center; background: #eaf6f6; border: 1px solid #457b9d; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Plans</h1>
  <div class="row">
    <article class="card"><h3>Starter</h3><p>199</p></article>
    <article class="card"><h3>Standard</h3><p>349</p></article>
    <article class="card"><h3>Premium</h3><p>499</p></article>
  </div>
</body>
</html>
