<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Units</title>
  <style>
    .pixel-box { width: 200px; height: 40px; background: #457b9d; margin-block: 10px; }
    .half-box { width: 50%; height: 40px; background: #a8dadc; margin-block: 10px; }
    p { font-size: 1.5rem; }
  </style>
</head>
<body>
  <h1>CSS Units</h1>
  <div class="pixel-box"></div>
  <div class="half-box"></div>
  <p>Relative and fixed units help size page elements.</p>
</body>
</html>
