<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
</head>
<body>
  <h1>Create an Account</h1>
  <form method="post" action="thanks.html">
    <p><label for="full-name">Full name</label><br><input id="full-name" name="full-name" type="text"></p>
    <p><label for="email">Email</label><br><input id="email" name="email" type="email"></p>
    <p><label for="password">Password</label><br><input id="password" name="password" type="password"></p>
    <button type="submit">Sign up</button>
  </form>
</body>
</html>
