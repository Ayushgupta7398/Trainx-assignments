<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stationery Shop</title>
  <style>
    .cards { display: flex; flex-wrap: wrap; gap: 16px; }
    .card { flex: 1 1 180px; padding: 16px; border: 1px solid #78909c; border-radius: 8px; background: #f1faee; }
  </style>
</head>
<body>
  <h1>Stationery Shop</h1>
  <div class="cards">
    <article class="card"><h2>Notebook</h2><p>Price: 60</p></article>
    <article class="card"><h2>Pen</h2><p>Price: 15</p></article>
    <article class="card"><h2>Bag</h2><p>Price: 350</p></article>
    <article class="card"><h2>Book</h2><p>Price: 120</p></article>
  </div>
</body>
</html>
