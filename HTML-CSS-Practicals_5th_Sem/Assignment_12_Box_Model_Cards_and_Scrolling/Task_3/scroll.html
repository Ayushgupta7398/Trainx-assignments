<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrollable Box</title>
  <style>
    .scroll-box { height: 120px; overflow: auto; max-width: 320px; border: 1px solid #555; padding: 8px; }
  </style>
</head>
<body>
  <h1>Scrollable Box</h1>
  <div class="scroll-box">
    <p>Line 1</p>
    <p>Line 2</p>
    <p>Line 3</p>
    <p>Line 4</p>
    <p>Line 5</p>
  </div>
</body>
</html>
