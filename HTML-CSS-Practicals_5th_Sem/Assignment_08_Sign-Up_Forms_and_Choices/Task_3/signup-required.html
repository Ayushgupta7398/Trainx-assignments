<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Required Sign-Up Details</title>
</head>
<body>
  <h1>Sign Up</h1>
  <form>
    <p><label for="full-name">Full name</label><br><input id="full-name" name="full-name" type="text" placeholder="Enter your full name" required></p>
    <p><label for="email">Email</label><br><input id="email" name="email" type="email" required></p>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
