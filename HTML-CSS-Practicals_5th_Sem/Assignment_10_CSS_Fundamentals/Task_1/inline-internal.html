<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inline and Internal CSS</title>
  <style>
    h1 { color: navy; }
    .highlight { background-color: yellow; }
  </style>
</head>
<body>
  <h1>CSS Fundamentals</h1>
  <p style="color: red;">This paragraph uses inline CSS.</p>
  <p class="highlight">This paragraph has a highlighted background.</p>
</body>
</html>
